name: daily-opportunity-report

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -q -B -DskipTests package

      - name: Run pipeline
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          V2EX_TOKEN: ${{ secrets.V2EX_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: java -jar target/sidehustle-daily-title.jar run

      - name: Commit data and report
        run: |
          git config user.name "sidehustle-bot"
          git config user.email "sidehustle-bot@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "daily report $(date -u +%Y-%m-%d)"
            git push
          fi
