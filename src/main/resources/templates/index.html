<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>商机看板</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<header class="top">
  <div>
    <p class="kicker">本地 SQLite · 无需远程数据库</p>
    <h1>抓取数据</h1>
    <p class="sub">按发布时间（北京时间）倒序。库文件 <code th:text="${dbPath}">data/sidehustle.db</code>，共 <strong th:text="${total}">0</strong> 条，符合条件 <strong th:text="${matched}">0</strong> 条，本页 <strong th:text="${shown}">0</strong> 条。</p>
  </div>
  <div class="actions">
    <a class="text-btn" th:href="@{/analysis}">需求分析</a>
    <form id="fetchForm" method="post" th:action="@{/fetch}">
      <input type="hidden" name="q" th:value="${q}"/>
      <input type="hidden" name="source" th:value="${source}"/>
      <input type="hidden" name="from" th:value="${from}"/>
      <input type="hidden" name="to" th:value="${to}"/>
      <input type="hidden" name="page" th:value="${page}"/>
      <input type="hidden" name="size" th:value="${size}"/>
      <button type="submit" th:disabled="${fetch.running}" th:text="${fetch.running} ? '抓取中…' : '重新抓取'">重新抓取</button>
    </form>
  </div>
</header>

<p class="flash" id="fetchStatus"
   th:if="${fetch.message != null and !fetch.message.isEmpty()}"
   th:classappend="${fetch.failed} ? 'bad' : (${fetch.running} ? 'run' : 'ok')"
   th:attr="data-running=${fetch.running}"
   th:text="${fetch.message}"></p>

<form id="searchForm" class="search" method="get" th:action="@{/}">
  <input type="hidden" name="page" value="1"/>
  <label>内容
    <input type="search" name="q" th:value="${q}" placeholder="标题、正文、社区、关键词" autocomplete="off"/>
  </label>
  <label>平台
    <select name="source" onchange="this.form.page.value='1'; this.form.requestSubmit()">
      <option value="" th:selected="${source == ''}">全部</option>
      <option th:each="c : ${counts}"
              th:value="${c.source}"
              th:text="${c.source + '（' + c.count + '）'}"
              th:selected="${source == c.source}">platform</option>
    </select>
  </label>
  <label>开始时间
    <span class="date-wrap">
      <input class="date" type="text" name="from" th:value="${from}" placeholder="选择日期" autocomplete="off"/>
    </span>
  </label>
  <label>结束时间
    <span class="date-wrap">
      <input class="date" type="text" name="to" th:value="${to}" placeholder="选择日期" autocomplete="off"/>
    </span>
  </label>
  <button type="submit">查询</button>
</form>

<main>
  <section class="empty" th:if="${total == 0}">
    <p>还没有数据。点右上角「重新抓取」，或先在项目目录执行 <code>java -jar target/sidehustle-daily-title.jar fetch</code>。</p>
  </section>
  <section class="empty" th:if="${total > 0 and matched == 0}">
    <p>没有符合当前筛选条件的数据。</p>
  </section>

  <section class="day" th:each="day : ${days}">
    <h2>
      <span th:text="${day.label}">2026-10-13</span>
      <em th:text="${day.cards.size()}">0</em>
    </h2>
    <article class="card" th:each="card : ${day.cards}">
      <div class="meta">
        <span class="tag" th:text="${card.post.source}" th:classappend="${card.post.source}">src</span>
        <span th:text="${card.post.community}">community</span>
        <time th:text="${card.time}">12:00</time>
        <span th:if="${card.post.numComments > 0}" th:text="'评论 ' + ${card.post.numComments}"></span>
        <span th:if="${card.post.score > 0}" th:text="'分数 ' + ${card.post.score}"></span>
      </div>
      <h3>
        <a th:href="${card.post.url}" th:text="${card.post.title}" target="_blank" rel="noopener">title</a>
      </h3>
      <p class="excerpt" th:if="${!#strings.isEmpty(card.excerpt)}" th:text="${card.excerpt}"></p>
      <p class="kw" th:if="${card.post.matchedKeyword != null and !#strings.isEmpty(card.post.matchedKeyword)}">
        命中 <code th:text="${card.post.matchedKeyword}">keyword</code>
      </p>
    </article>
  </section>

  <nav class="pager">
    <div class="pager-nav" th:if="${matched > 0}">
      <span class="pager-sum" th:text="${'第 ' + page + ' / ' + pages + ' 页'}"></span>
      <a th:if="${page > 1}" th:href="@{/(q=${q},source=${source},from=${from},to=${to},size=${size},page=${page - 1})}">上一页</a>
      <span th:unless="${page > 1}" class="off">上一页</span>
      <th:block th:each="link : ${pageLinks}">
        <span th:if="${link.gap()}" class="gap">…</span>
        <a th:unless="${link.gap()}"
           th:href="@{/(q=${q},source=${source},from=${from},to=${to},size=${size},page=${link.n()})}"
           th:text="${link.n()}"
           th:classappend="${link.n() == page} ? 'on'">1</a>
      </th:block>
      <a th:if="${page < pages}" th:href="@{/(q=${q},source=${source},from=${from},to=${to},size=${size},page=${page + 1})}">下一页</a>
      <span th:unless="${page < pages}" class="off">下一页</span>
    </div>
    <div class="size">
      <span>每页</span>
      <button type="button" th:each="n : ${sizeChoices}" th:text="${n}"
              th:classappend="${size == n} ? 'on'" th:attr="data-size=${n}">15</button>
      <input id="pageSize" type="number" name="size" form="searchForm" min="1" max="200" th:value="${size}" aria-label="每页条数"/>
      <span>条</span>
    </div>
  </nav>
</main>
<script th:src="@{/calendar.js}"></script>
<script>
  const form = document.getElementById('searchForm');
  const sizeInput = document.getElementById('pageSize');
  document.querySelectorAll('[data-size]').forEach((btn) => {
    btn.addEventListener('click', () => {
      sizeInput.value = btn.dataset.size;
      form.page.value = '1';
      form.requestSubmit();
    });
  });
  sizeInput.addEventListener('change', () => {
    form.page.value = '1';
    form.requestSubmit();
  });

  const fetchForm = document.getElementById('fetchForm');
  fetchForm.addEventListener('submit', () => {
    const btn = fetchForm.querySelector('button');
    btn.disabled = true;
    btn.textContent = '抓取中…';
  });
  const fetchStatus = document.getElementById('fetchStatus');
  if (fetchStatus && fetchStatus.dataset.running === 'true') {
    const timer = setInterval(async () => {
      try {
        const res = await fetch('/fetch/status');
        if (!res.ok) return;
        const s = await res.json();
        fetchStatus.textContent = s.message || '';
        fetchStatus.className = 'flash ' + (s.failed ? 'bad' : (s.running ? 'run' : 'ok'));
        if (!s.running) {
          clearInterval(timer);
          location.reload();
        }
      } catch (e) { /* keep the last status until the next poll */ }
    }, 2000);
  }
</script>
</body>
</html>
